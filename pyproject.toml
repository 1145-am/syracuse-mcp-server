[project]
name = "syracuse-mcp-server"
version = "1.3.0"
description = "MCP server for the Syracuse company news API: structured, typed, dated, source-linked company and industry events."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "requests",
    "python-dotenv",
    "mcp>=1.27.0,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]

